schemaVersion: 2.1.0
metadata:
  name: workout-tracker
components:
  - name: workout-tracker
    container:
      image: adrianstoica/it1901:latest
      memoryLimit: 3Gi
      mountSources: true
      command: ["bash", "-lc"]
      args: ["bash /projects/gr2528/.che/start-desktop.sh; tail -f /dev/null"]
      endpoints:
        - exposure: public
          name: 6080-desktop-ui
          protocol: https
          targetPort: 6080
        - exposure: public
          name: 5900-tcp
          protocol: http
          targetPort: 5900
        - exposure: public
          name: 5901-tcp
          protocol: http
          targetPort: 5901
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080
        - exposure: public
          name: 5500-tcp
          protocol: http
          targetPort: 5500
