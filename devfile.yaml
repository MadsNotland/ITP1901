schemaVersion: 2.2.0
metadata:
  name: workout-tracker
components:
  - name: gr2528
    container:
      image: maven:3.9.6-eclipse-temurin-17
      memoryLimit: 2Gi
      mountSources: true
      command: ["tail"]
      args: ["-f", "/dev/null"]
commands:
  - id: test
    exec:
      component: gr2528
      commandLine: "mvn test"
      workingDir: "/projects/gr2528/workout-tracker"
  - id: run
    exec:
      component: gr2528
      commandLine: "mvn javafx:run"
      workingDir: "/projects/gr2528/workout-tracker"
