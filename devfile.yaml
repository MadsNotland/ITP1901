schemaVersion: 2.2.0
metadata:
  name: javafx-app
components:
  - name: tools
    container:
      image: maven:3.9.6-eclipse-temurin-17
      memoryLimit: 2Gi
      mountSources: true
      command: ['tail']
      args: ['-f', '/dev/null']
commands:
  - id: test
    exec:
      component: tools
      commandLine: "mvn test"
      workingDir: "/projects/gr2528/app"
  - id: run
    exec:
      component: tools
      commandLine: "mvn javafx:run"
      workingDir: "/projects/gr2528/app"
